spring.application.name=finco
spring.config.import=optional:file:.env[.properties]

# Port du backend (8080 est déjà pris sur ce PC). Surcharge possible via SERVER_PORT.
server.port=${SERVER_PORT:8081}

# --- Connexion MySQL (base `finco_db`) ------------------------------------
# createDatabaseIfNotExist=true : MySQL crée la base `finco` si elle n'existe pas.
# Les valeurs ${VAR:defaut} sont des placeholders : on lit la variable
# d'environnement, sinon la valeur par défaut. Le mot de passe n'est jamais
# écrit en clair dans le code.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finco_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Casablanca&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate --------------------------------------------------------
# update : Hibernate crée ou complète les tables à partir des @Entity
# (sans jamais supprimer de colonnes ni de données).
spring.jpa.hibernate.ddl-auto=update
# Affiche dans la console chaque requête SQL générée par Hibernate.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# --- Sécurité / CORS ----------------------------------------------------------
app.jwt.secret=${JWT_SECRET:changer-cette-cle-secrete-de-32-caracteres-minimum-finco}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173,http://localhost:5174}

# --- Double authentification : code OTP envoyé par email --------------------
app.otp.duree-validite-minutes=5
app.otp.tentatives-max=5
app.otp.delai-renvoi-secondes=30
app.mail.expediteur=${MAIL_FROM:FinCo <no-reply@finco.ma>}

# --- Assistant Gemini : clé API conservée côté serveur ---------------------
app.chatbot.gemini.api-key=${GEMINI_API_KEY:}
app.chatbot.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
