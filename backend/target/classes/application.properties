spring.application.name=finco

# Port du backend (8080 est déjà pris sur ce PC). Surcharge possible via SERVER_PORT.
server.port=${SERVER_PORT:8081}

# --- Connexion MySQL (base `finco`) ---------------------------------------
# createDatabaseIfNotExist=true : MySQL crée la base `finco` si elle n'existe pas.
# Les valeurs ${VAR:defaut} sont des placeholders : on lit la variable
# d'environnement, sinon la valeur par défaut. Le mot de passe n'est jamais
# écrit en clair dans le code.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finco?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Casablanca&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate --------------------------------------------------------
# update : Hibernate crée ou complète les tables à partir des @Entity
# (sans jamais supprimer de colonnes ni de données).
spring.jpa.hibernate.ddl-auto=update
# Affiche dans la console chaque requête SQL générée par Hibernate.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# --- Sécurité / CORS ----------------------------------------------------------
app.jwt.secret=${JWT_SECRET:changer-cette-cle-secrete-de-32-caracteres-minimum-finco}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# --- Double authentification : code OTP envoyé par email --------------------
app.otp.duree-validite-minutes=5
app.otp.tentatives-max=5
app.otp.delai-renvoi-secondes=30
app.mail.expediteur=${MAIL_FROM:FinCo <no-reply@finco.ma>}

# Envoi réel des emails (facultatif). SANS cette configuration, le code OTP
# s'affiche dans la console du backend (pratique en développement).
# Exemple avec Gmail : créer un « mot de passe d'application » sur le compte
# Google, définir MAIL_USERNAME et MAIL_PASSWORD, puis décommenter :
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
