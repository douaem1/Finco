spring.application.name=finco
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/finco_db?useSSL=false&serverTimezone=Africa/Casablanca&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

app.jwt.secret=${JWT_SECRET:changer-cette-cle-secrete-de-32-caracteres-minimum-finco}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}