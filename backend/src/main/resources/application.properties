spring.application.name=finco
server.port=8080

# ===== Connexion MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/finco_db?useSSL=false&serverTimezone=Africa/Casablanca
spring.datasource.username=root
spring.datasource.password=

# Les tables sont créées par finco_db.sql, Hibernate ne touche pas au schéma
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# ===== JWT + CORS (React sur le port 5173) =====
app.jwt.secret=changer-cette-cle-secrete-de-32-caracteres-minimum-finco
app.jwt.expiration-ms=86400000
app.cors.allowed-origin=http://localhost:5173